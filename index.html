<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>Trainingslog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap">
<style>
/* Layout: één smalle kolom (max 560px) met kaarten op een koel-grijze ondergrond, vaste tabbalk onderin en een rustbalk erboven */
:root {
  --bg: #EDF0F4;
  --card: #FFFFFF;
  --ink: #15181D;
  --muted: #555B66;
  --faint: #7A808B;
  --line: #D3D7DE;
  --soft: #F4F6F8;
  --chip: #EDF0F4;
  --accent: #C2410C;
  --accent-ink: #B53D0A;
  --on-accent: #FFFFFF;
  --accent-soft: #FFE8DC;
  --accent-soft-ink: #7A2A06;
  --accent-dash: #E3A788;
  --accent-area: rgba(194, 65, 12, 0.10);
  --good: #047857;
  --danger: #B42318;
  --dark: #15181D;
  --dark-2: #2A2D33;
  --on-dark: #FFFFFF;
  --shadow: rgba(21, 24, 29, 0.14);
  --m-base: #BCC1CA; --m-idle: #EEF0F3; --m-line: #9DA3AD; --m-bone: #D5D9DF; --m-1: #FCC6A8; --m-2: #F08F60; --m-3: #C2410C; --m-2s: #D9703F; --m-3s: #A33608; --m-1ink: #5C2207; --m-2ink: #2B1003;
  --backdrop: rgba(21, 24, 29, 0.45);
  --font: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --nav-h: 64px;
  --rest-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1216; --card: #1A1E24; --ink: #EEF0F3; --muted: #A3AAB5; --faint: #858C98; --line: #363B44;
    --soft: #20252C; --chip: #262B33; --accent: #FF8A4C; --accent-ink: #FF9D66; --on-accent: #1A0E07;
    --accent-soft: #3A2418; --accent-soft-ink: #FFC29E; --accent-dash: #7A4A30; --accent-area: rgba(255, 138, 76, 0.14);
    --good: #34D399; --danger: #F97066; --dark: #2C3139; --dark-2: #3B414B; --on-dark: #FFFFFF;
    --shadow: rgba(0, 0, 0, 0.5); --backdrop: rgba(0, 0, 0, 0.6);
    --m-base: #4A505B; --m-idle: #2A2F37; --m-line: #636A75; --m-bone: #3A3F48; --m-1: #5C3421; --m-2: #A9542C; --m-3: #FF8A4C; --m-2s: #C2643A; --m-3s: #FFA472; --m-1ink: #FFD9C4; --m-2ink: #FFFFFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1216; --card: #1A1E24; --ink: #EEF0F3; --muted: #A3AAB5; --faint: #858C98; --line: #363B44;
  --soft: #20252C; --chip: #262B33; --accent: #FF8A4C; --accent-ink: #FF9D66; --on-accent: #1A0E07;
  --accent-soft: #3A2418; --accent-soft-ink: #FFC29E; --accent-dash: #7A4A30; --accent-area: rgba(255, 138, 76, 0.14);
  --good: #34D399; --danger: #F97066; --dark: #2C3139; --dark-2: #3B414B; --on-dark: #FFFFFF;
  --shadow: rgba(0, 0, 0, 0.5); --backdrop: rgba(0, 0, 0, 0.6);
    --m-base: #4A505B; --m-idle: #2A2F37; --m-line: #636A75; --m-bone: #3A3F48; --m-1: #5C3421; --m-2: #A9542C; --m-3: #FF8A4C; --m-2s: #C2643A; --m-3s: #FFA472; --m-1ink: #FFD9C4; --m-2ink: #FFFFFF; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.4;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.min0 { min-width: 0; }
.muted { color: var(--muted); }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom, 0px));
}
body.has-rest .wrap { padding-bottom: calc(var(--nav-h) + var(--rest-h) + 40px + env(safe-area-inset-bottom, 0px)); }
.view { display: flex; flex-direction: column; gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.row-between.end { align-items: flex-end; }

h1 { margin: 0; font-size: 30px; line-height: 1.08; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
h2 { margin: 6px 0 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.eyebrow { font-size: 14px; color: var(--muted); font-weight: 600; }
.pill { font-size: 14px; font-weight: 600; background: var(--card); padding: 6px 12px; border-radius: 999px; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-soft-ink); }

.card { background: var(--card); border-radius: 20px; padding: 16px; border: 0; }
.title-input {
  width: 100%; border: 0; background: transparent; padding: 0; margin-top: 2px;
  font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; border-radius: 6px;
}
.title-input:focus { outline: none; box-shadow: 0 2px 0 var(--accent); }
.progress { height: 6px; background: var(--card); border-radius: 6px; overflow: hidden; }
.progress > div { height: 6px; background: var(--accent); border-radius: 6px; transition: width .3s; }

.date-pick {
  position: relative; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  padding: 0 12px; border-radius: 999px; background: var(--card); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer;
}
.date-pick svg { width: 18px; height: 18px; color: var(--accent-ink); flex: none; }
.date-pick svg:last-of-type { color: var(--muted); }
.date-pick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; cursor: pointer; -webkit-appearance: none; appearance: none; }
.date-pick:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
/* Knoppen */
.btn {
  min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.btn-dark { background: var(--dark); color: var(--on-dark); border-radius: 999px; }
.btn-accent { background: var(--accent); color: var(--on-accent); }
.btn-soft { background: var(--chip); color: var(--ink); }
.btn-dashed { background: transparent; border: 2px dashed var(--accent-dash); color: var(--accent-ink); }
.btn-ghost-accent { background: transparent; color: var(--accent-ink); font-weight: 700; }
.btn-block { width: 100%; }
.btn-lg { min-height: 52px; font-size: 17px; font-weight: 700; border-radius: 14px; }
.btn-text { background: none; border: 0; min-height: 44px; font-weight: 600; color: var(--muted); }
.btn-text.danger { color: var(--danger); }
.icon-btn {
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: var(--muted);
  display: inline-flex; align-items: center; justify-content: center; flex: none;
}
.icon-btn:active, .btn:active { transform: scale(0.98); }
.link-back { align-self: flex-start; background: none; border: 0; padding: 0; min-height: 44px; color: var(--accent-ink); font-weight: 700; font-size: 16px; }

/* Oefeningkaart */
.ex-card { display: flex; flex-direction: column; gap: 10px; }
.ex-head { display: flex; align-items: center; gap: 4px; margin: -6px -8px -4px 0; }
.ex-title { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 6px 0; font-size: 19px; font-weight: 800; }
.ex-sub { font-size: 13px; color: var(--muted); }
.set-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.set-head { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.set-tag {
  width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--chip); color: var(--ink);
  font-weight: 800; font-size: 15px;
}
.set-tag.warm { color: var(--muted); }
.num {
  width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;
  background: var(--card); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.num::placeholder { color: var(--faint); font-weight: 600; opacity: 1; }
.num:focus { outline: none; border: 2px solid var(--accent); padding: 0 11px; }
.check {
  width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink);
}
.set-row.is-done .num { background: var(--soft); border-color: transparent; }
.set-row.is-done .check { background: var(--accent-soft); border-color: transparent; }
.set-row.warmrow .num { color: var(--muted); }
.ex-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.note textarea {
  width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 12px; background: var(--soft); font-size: 16px;
}
.ex-collapsed {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px;
  font-weight: 700; font-size: 16px; text-align: left; width: 100%;
}
.ex-collapsed .count { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; color: var(--muted); flex: none; }
.ex-collapsed.all-done .count { color: var(--good); }

/* Lijsten en tegels */
.list-card { display: flex; flex-direction: column; text-align: left; gap: 4px; width: 100%; }
.list-card .name { font-size: 18px; font-weight: 800; }
.list-card .meta { font-size: 14px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--card); border-radius: 16px; padding: 12px; }
.tile .v { font-size: 26px; font-weight: 800; line-height: 1.1; }
.tile .l { font-size: 13px; color: var(--muted); }
.segmented { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--card); border-radius: 14px; padding: 4px; }
.segmented button { height: 40px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; color: var(--muted); }
.segmented button[aria-pressed="true"] { background: var(--dark); color: var(--on-dark); }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
.select, .text {
  height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; background: var(--card);
  font-size: 16px; font-weight: 600; color: var(--ink); width: 100%;
}
.hist-item { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%; }
.hist-day { text-align: center; line-height: 1.05; }
.hist-day .d { font-size: 22px; font-weight: 800; }
.hist-day .w { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.rows { display: flex; flex-direction: column; }
.rows > * { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--chip); }
.rows > *:last-child { border-bottom: 0; }
.banner { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: var(--accent-soft); color: var(--accent-soft-ink); border-radius: 16px; padding: 12px 12px 12px 16px; font-size: 14px; font-weight: 600; }
.banner .btn { background: var(--card); color: var(--accent-ink); min-height: 40px; flex: none; }
.empty { text-align: center; padding: 28px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }

/* Schema-editor */
.tpl-item { display: flex; flex-direction: column; gap: 10px; }
.tpl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; height: 46px; }
.stepper button { height: 44px; border: 0; background: var(--soft); font-size: 20px; font-weight: 700; }
.stepper output { text-align: center; font-size: 17px; font-weight: 800; }
.toggle-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; font-weight: 600; }
.toggle-row input { width: 24px; height: 24px; accent-color: var(--accent); }

/* Spierfiguur */
.body-map { display: block; width: 100%; height: auto; }
.body-map .base { fill: var(--m-base); }
.body-map .mz { fill: var(--m-idle); stroke: var(--m-line); stroke-width: 0.8; stroke-linejoin: round; transition: fill .2s; }
.body-map .mz.bone { fill: var(--m-bone); }
.body-map .mz.l3 { fill: var(--m-3); stroke: var(--m-3s); }
.body-map .mz.l2 { fill: var(--m-2); stroke: var(--m-2s); }
.body-map .mz.l1 { fill: var(--m-1); }
figure.bm { margin: 0; }
figure.bm figcaption { display: grid; text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.card > figure.bm, .sheet-inner > figure.bm, .more figure.bm { max-width: 340px; width: 100%; margin: 0 auto; }
.big-map { background: var(--soft); border-radius: 18px; padding: 14px 14px 10px; }
.big-map figure.bm { max-width: 300px; margin: 0 auto; }
.more summary { cursor: pointer; font-weight: 600; color: var(--accent-ink); min-height: 40px; display: flex; align-items: center; }
.more figure.bm { margin-top: 6px; }
.info-box { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; background: var(--accent-soft); color: var(--accent-soft-ink); border-radius: 14px; padding: 12px 14px; }
.info-box p { margin: 0; color: var(--accent-soft-ink); font-size: 15px; line-height: 1.45; }
.ex-info { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 10px; align-items: center; }
.ex-muscles { font-size: 14px; margin-top: 6px; line-height: 1.35; display: flex; flex-direction: column; gap: 2px; }
.mini-map { background: var(--soft); border-radius: 12px; padding: 6px; width: 104px; }
.link-inline { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: var(--accent-ink); text-decoration: underline; cursor: pointer; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: 0; flex: none; }
.dot.l3 { background: var(--m-3); } .dot.l2 { background: var(--m-2); } .dot.l1 { background: var(--m-1); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 5px; }
.mchips { display: flex; flex-wrap: wrap; gap: 6px; }
.mchip { min-height: 36px; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-size: 14px; font-weight: 600; color: var(--ink); text-align: left; }
.mchip small { display: block; font-weight: 600; font-size: 11px; color: var(--muted); }
.mchip.l3 { background: var(--m-3); border-color: var(--m-3); color: var(--on-accent); }
.mchip.l3 small { color: var(--on-accent); }
.mchip.l2 { background: var(--m-2); border-color: var(--m-2); color: var(--m-2ink); }
.mchip.l2 small { color: var(--m-2ink); }
.mchip.l1 { background: var(--m-1); border-color: var(--m-1); color: var(--m-1ink); }
.mchip.l1 small { color: var(--m-1ink); }
.pick-group h4 { display: flex; align-items: center; }
.muscle-rows > div { min-height: 40px; }
.muscle-rows > div > span { display: flex; align-items: center; min-width: 0; }
/* Grafiek */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--chip); stroke-width: 1; }
.chart .axis-t { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-area); stroke: none; }
.chart .dot { fill: var(--accent); stroke: var(--card); stroke-width: 2; }
.chart .dot.sel { fill: var(--card); stroke: var(--accent); stroke-width: 3; }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hit:focus-visible { outline: none; fill: var(--accent-area); }
.chart-info { min-height: 22px; font-size: 14px; margin-top: 6px; }
.delta-up { color: var(--good); font-weight: 700; }

/* Tabbalk, rustbalk, sheets */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--card);
  border-top: 1px solid var(--chip);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar-inner { max-width: 560px; margin: 0 auto; height: var(--nav-h); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabbar button[aria-current="page"] { color: var(--accent-ink); }
.restbar {
  position: fixed; z-index: 19; left: 0; right: 0;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 8px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.restbar-inner {
  position: relative; overflow: hidden; max-width: 528px; margin: 0 auto; height: var(--rest-h); border-radius: 16px;
  background: var(--dark); color: var(--on-dark); display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px 0 16px; box-shadow: 0 8px 24px var(--shadow);
}
.restbar-fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
.restbar-inner.done { background: var(--accent); color: var(--on-accent); }
.restbar .t { font-size: 20px; font-weight: 800; margin-left: 6px; }
.restbar .acts { display: flex; gap: 4px; position: relative; }
.restbar .acts button { height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--dark-2); color: var(--on-dark); font-weight: 600; font-size: 14px; }
.restbar-inner.done .acts button { background: var(--card); color: var(--accent-ink); }
.sheet-backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 40; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--card); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 32px var(--shadow);
  padding-top: 10px;
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
.sheet-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sheet .grabber { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.sheet h3 { margin: 4px 0 0; font-size: 20px; font-weight: 800; }
.sheet p { margin: 0; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--chip); font-weight: 600; font-size: 14px; }

/* states: { regio: 'l1' | 'l2' | 'l3' }.  opt.view: 'both' | 'front' | 'back'; opt.crop: 'upper' | 'lower' | null; opt.caps: onderschriften */
function bodySvg(states, opt) {
  opt = opt || {};
  const one = (d, cls) => `<g class="${cls}">${d}</g>`;
  const draw = (f, cls) => one(f.d, cls) + (f.m ? `<g class="${cls}" transform="matrix(-1 0 0 1 200 0)">${f.d}</g>` : '');
  const base = BODY_BASE.map(f => typeof f === 'string' ? one(f, 'base') : draw(f, 'base')).join('');
  const fig = (list, dx) => `<g transform="translate(${dx} 0)">${base}${list.map(f => draw(f, 'mz' + (f.r ? ' ' + (states[f.r] || '') : ' bone'))).join('')}</g>`;
  const view = opt.view || 'both';
  const parts = view === 'front' ? [[BODY_FRONT, 'Voorkant']] : view === 'back' ? [[BODY_BACK, 'Achterkant']] : [[BODY_FRONT, 'Voorkant'], [BODY_BACK, 'Achterkant']];
  const y0 = opt.crop === 'lower' ? 236 : 2;
  const y1 = opt.crop === 'upper' ? 264 : 438;
  const aria = opt.label ? `role="img" aria-label="${String(opt.label).replace(/"/g, '&quot;')}"` : 'aria-hidden="true"';
  const svg = `<svg class="body-map" viewBox="0 ${y0} ${parts.length * 210 - 10} ${y1 - y0}" ${aria}>${parts.map((p, i) => fig(p[0], i * 210)).join('')}</svg>`;
  if (!opt.caps) return svg;
  return `<figure class="bm">${svg}<figcaption style="grid-template-columns:repeat(${parts.length},minmax(0,1fr))">${parts.map(p => `<span>${p[1]}</span>`).join('')}</figcaption></figure>`;
}

function viewFor(act) {
  const rs = Object.keys(act).filter(r => act[r]);
  if (!rs.length) return { view: 'both' };
  const view = rs.every(r => FRONT_R.has(r)) ? 'front' : rs.every(r => BACK_R.has(r)) ? 'back' : 'both';
  const upper = rs.every(r => !LEG_R.has(r) && r !== 'glute_med');
  const lower = rs.every(r => LEG_R.has(r) || r === 'glute_med' || r === 'lowerback');
  return { view, crop: upper ? 'upper' : lower ? 'lower' : null };
}

/* ================= Opslag =================
   Alle data zit in één object. Elk record heeft een vaste id, updatedAt en deleted,
   zodat het later met een online database (Supabase, zie SUPABASE.md) te synchroniseren is.
   Het scherm praat alleen met deze laag; een online adapter kan LocalAdapter later vervangen of aanvullen. */
const STORE_KEY = 'trainingslog:v1';
const REST_KEY = 'trainingslog:rest';
const LocalAdapter = {
  load() { try { const raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } },
  save(data) { try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); return true; } catch (e) { return false; } }
};

function seed() {
  const t = nowIso();
  return {
    meta: { schemaVersion: 1, deviceId: uid(), createdAt: t, lastBackupAt: null, activeWorkoutId: null },
    settings: { id: 'settings', defaultRest: 90, keepAwake: true, theme: 'auto', updatedAt: t },
    exercises: [], templates: [], workouts: []
  };
}
function migrate(d) {
  const base = seed();
  if (!d || typeof d !== 'object') d = base;
  d.meta = Object.assign({}, base.meta, d.meta || {});
  d.settings = Object.assign({}, base.settings, d.settings || {});
  ['exercises', 'templates', 'workouts'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  const have = new Set(d.exercises.map(e => e.id));
  const t = '2026-01-01T00:00:00.000Z';
  LIBRARY.forEach(([slug, name, muscle, equipment]) => {
    const id = 'lib-' + slug;
    if (!have.has(id)) d.exercises.push({ id, name, muscle, equipment, custom: false, updatedAt: t, deleted: false });
  });
  const libName = {}; LIBRARY.forEach(([slug, name]) => { libName['lib-' + slug] = name; });
  d.exercises.forEach(e => {
    const slug = String(e.id).startsWith('lib-') ? e.id.slice(4) : null;
    if (slug && libName[e.id]) e.name = libName[e.id];
    if (slug && EX_ACT[slug] && !e.actEdited) { e.act = Object.assign({}, EX_ACT[slug][0]); return; }
    if (e.act) return;
    const act = {};
    if (Array.isArray(e.primary)) {
      (e.secondary || []).forEach(m => (OLD_MUSCLE_MAP[m] || []).forEach(r => { act[r] = 1; }));
      e.primary.forEach(m => (OLD_MUSCLE_MAP[m] || []).forEach(r => { act[r] = 3; }));
      e.act = act;
    } else e.act = Object.assign({}, GROUP_ACT[e.muscle] || {});
  });
  if (d.meta.activeWorkoutId) {
    const w = d.workouts.find(x => x.id === d.meta.activeWorkoutId);
    if (!w || w.deleted || w.endedAt) d.meta.activeWorkoutId = null;
  }
  return d;
}
/* Samenvoegen per record: de nieuwste updatedAt wint. Gebruikt bij terugzetten van een back-up en straks bij synchronisatie. */
function mergeData(local, incoming) {
  const out = migrate(JSON.parse(JSON.stringify(local)));
  const inc = migrate(JSON.parse(JSON.stringify(incoming)));
  ['exercises', 'templates', 'workouts'].forEach(k => {
    const map = new Map(out[k].map(r => [r.id, r]));
    inc[k].forEach(r => { const cur = map.get(r.id); if (!cur || String(r.updatedAt || '') > String(cur.updatedAt || '')) map.set(r.id, r); });
    out[k] = [...map.values()];
  });
  if (String(inc.settings.updatedAt || '') > String(out.settings.updatedAt || '')) out.settings = inc.settings;
  const lb = [out.meta.lastBackupAt, inc.meta.lastBackupAt].filter(Boolean).sort().pop() || null;
  out.meta.lastBackupAt = lb;
  return migrate(out);
}

const restFor = we => we.restSec || db.settings.defaultRest || 90;

/* ================= Rekenwerk ================= */
const finishedWorkouts = () => live(db.workouts).filter(w => w.endedAt).sort((a, b) => a.startedAt.localeCompare(b.startedAt));
const isWorkingSet = s => s.done && !s.warmup && s.kg != null && s.reps > 0;

/* Werkset-gewicht: tel per gewicht de herhalingen van de werksets op.
   Het gewicht met de meeste herhalingen wint; bij gelijkspel het zwaarste gewicht. */
function workingWeight(we) {
  const sets = we.sets.filter(isWorkingSet);
  if (!sets.length) return null;
  const by = new Map();
  sets.forEach(s => { const g = by.get(s.kg) || { kg: s.kg, reps: 0, list: [] }; g.reps += s.reps; g.list.push(s.reps); by.set(s.kg, g); });
  let best = null;
  by.forEach(g => { if (!best || g.reps > best.reps || (g.reps === best.reps && g.kg > best.kg)) best = g; });
  return best;
}
const wwText = ww => fmtNum(ww.kg) + ' kg × ' + ww.list.join(' · ');

function previousEntry(exId, excludeId, beforeIso) {
  const list = finishedWorkouts().filter(w => w.id !== excludeId && (!beforeIso || w.startedAt < beforeIso));
  for (let i = list.length - 1; i >= 0; i--) {
    const we = list[i].exercises.find(x => x.exerciseId === exId && x.sets.some(s => s.done));
    if (we) return { w: list[i], we };
  }
  return null;
}
function sessionsFor(exId) {
  const out = [];
  finishedWorkouts().forEach(w => w.exercises.forEach(we => {
    if (we.exerciseId !== exId) return;
    const ww = workingWeight(we);
    if (ww) out.push({ w, we, ww });
  }));
  return out;
}
/* Record = werkset-gewicht hoger dan bij alle eerdere trainingen met die oefening (de eerste keer telt niet). */
function recordsIn(w) {
  const recs = [];
  w.exercises.forEach(we => {
    const ww = workingWeight(we);
    if (!ww) return;
    let best = null;
    finishedWorkouts().forEach(o => {
      if (o.id === w.id || o.startedAt >= w.startedAt) return;
      o.exercises.forEach(x => { if (x.exerciseId === we.exerciseId) { const v = workingWeight(x); if (v && (best == null || v.kg > best)) best = v.kg; } });
    });
    if (best != null && ww.kg > best && !recs.some(r => r.exerciseId === we.exerciseId)) recs.push({ exerciseId: we.exerciseId, kg: ww.kg });
  });
  return recs;
}
/* Grijze voorinvulling per set: opwarmset ↔ opwarmset en werkset ↔ werkset van de vorige keer. */
function placeholders(w, we) {
  const prev = previousEntry(we.exerciseId, w.id, w.startedAt);
  const pw = prev ? prev.we.sets.filter(s => s.done && s.warmup) : [];
  const pk = prev ? prev.we.sets.filter(s => s.done && !s.warmup) : [];
  let wi = 0, ki = 0, last = null;
  return we.sets.map(s => {
    const src = s.warmup ? pw[wi++] : pk[ki++];
    const kg = src ? src.kg : (last ? last.kg : null);
    const reps = src ? src.reps : (last && !s.warmup && !last.warm ? last.reps : (we.targetReps || null));
    last = { kg: s.kg != null ? s.kg : kg, reps: s.reps != null ? s.reps : reps, warm: s.warmup };
    return { kg, reps };
  });
}

function makeSet(warm) { return { id: uid(), kg: null, reps: null, warmup: !!warm, done: false }; }
function makeWE(exId, opt, beforeIso) {
  opt = opt || {};
  const prev = previousEntry(exId, null, beforeIso || null);
  const warm = opt.warmups != null ? opt.warmups : (prev ? prev.we.sets.filter(s => s.warmup).length : 0);
  const work = opt.sets != null ? opt.sets : (prev ? Math.max(1, prev.we.sets.filter(s => !s.warmup).length) : 3);
  const sets = [];
  for (let i = 0; i < warm; i++) sets.push(makeSet(true));
  for (let i = 0; i < work; i++) sets.push(makeSet(false));
  return { id: uid(), exerciseId: exId, note: '', targetReps: opt.reps || null, restSec: opt.restSec || null, sets };
}
function locateWE(weId) {
  for (const w of live(db.workouts)) { const we = w.exercises.find(x => x.id === weId); if (we) return { w, we }; }
  return null;
}

  else if (themeSetByApp) { root.removeAttribute('data-theme'); themeSetByApp = false; }

}
function renderTabs() {

function needsBackup() {
  if (!finishedWorkouts().length) return false;

  return !last || (Date.now() - new Date(last).getTime()) > 7 * 86400000;
}
function backupBanner() {

}

}

/* ---------- Training: invoeren (ook gebruikt voor bewerken uit Historie) ---------- */
function workoutEditor(w, mode) {
  const isLive = mode === 'live';
  ui.ctxWorkoutId = w.id;
  const total = w.exercises.reduce((n, we) => n + we.sets.length, 0);
  const done = w.exercises.reduce((n, we) => n + we.sets.filter(s => s.done).length, 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  if (ui.openWE !== 'none' && !w.exercises.some(we => we.id === ui.openWE)) {
    const first = w.exercises.find(we => we.sets.some(s => !s.done)) || w.exercises[0];
    ui.openWE = first ? first.id : null;
  }
  const cards = w.exercises.map((we, i) => we.id === ui.openWE ? exerciseCard(w, we) : exerciseCollapsed(we)).join('');
  return `
    ${isLive ? '' : '<button type="button" class="link-back" data-act="close-edit">‹ Historie</button>'}
    <header class="stack">
      <div class="row-between">
        ${datePicker('w-date', dateStr(new Date(w.startedAt)), 'Datum van deze training')}
        ${isLive ? '<span class="pill" id="elapsed">0:00</span>' : `<span class="pill">${fmtDuration(new Date(w.endedAt) - new Date(w.startedAt))}</span>`}
      </div>
      <div class="row-between end">
        <div class="min0" style="flex:1">
          <div class="eyebrow">${w.templateId && getTemplate(w.templateId) ? 'Schema' : 'Training'}</div>
          <label class="sr" for="w-name">Naam van de training</label>
          <input class="title-input" id="w-name" data-in="w-name" value="${esc(w.name)}" autocomplete="off">
        </div>
        ${isLive ? '<button type="button" class="btn btn-dark" data-act="finish">Afronden</button>' : '<button type="button" class="btn btn-dark" data-act="close-edit">Klaar</button>'}
      </div>
      <div class="progress" role="progressbar" aria-label="Sets afgevinkt" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div style="width:${pct}%"></div></div>
    </header>
    <section class="stack">
      ${cards || '<div class="card empty"><p>Nog geen oefeningen in deze training.</p></div>'}
      <button type="button" class="btn btn-ghost-accent" data-act="pick-ex" data-target="workout">+ Oefening toevoegen</button>
      ${isLive
        ? '<button type="button" class="btn-text danger" data-act="cancel-workout">Training stoppen zonder opslaan</button>'
        : `<button type="button" class="btn-text danger" data-act="delete-workout" data-id="${w.id}">Training verwijderen</button>`}
    </section>`;
}
function datePicker(key, ymd, label) {
  const [y, m, d] = ymd.split('-').map(Number);
  const iso = new Date(y, m - 1, d).toISOString();
  const txt = key === 'w-date' ? fmtDateShort(iso) : fmtDateLong(iso);
  const isToday = ymd === todayStr();
  return `<label class="date-pick" for="${key}">
    <span class="sr">${label}</span>
    ${ICON.history}<span>${isToday ? 'Vandaag · ' : ''}${txt}</span>${ICON.down}
    <input type="date" id="${key}" data-ch="${key}" value="${ymd}" max="${todayStr()}" required>
  </label>`;
}
function exerciseCard(w, we) {
  const ex = getEx(we.exerciseId);
  const ph = placeholders(w, we);
  const prev = previousEntry(we.exerciseId, w.id, w.startedAt);
  const pww = prev ? workingWeight(prev.we) : null;
  const unit = ex && ex.equipment === 'dumbbell' ? 'kg p/h' : 'kg';
  let n = 0;
  const rows = we.sets.map((s, j) => {
    const tag = s.warmup ? 'W' : String(++n);
    const p = ph[j];
    const lab = s.warmup ? 'opwarmset' : 'werkset ' + tag;
    return `<div class="set-row${s.done ? ' is-done' : ''}${s.warmup ? ' warmrow' : ''}">
      <button type="button" class="set-tag${s.warmup ? ' warm' : ''}" data-act="set-menu" data-we="${we.id}" data-set="${s.id}" aria-label="${cap(lab)}, opties">${tag}</button>
      <input class="num" id="kg-${s.id}" data-in="set-kg" data-we="${we.id}" data-set="${s.id}" inputmode="decimal" enterkeyhint="next" autocomplete="off"
        value="${s.kg == null ? '' : fmtNum(s.kg)}" placeholder="${p.kg == null ? '' : fmtNum(p.kg)}" aria-label="Gewicht in ${unit}, ${lab}">
      <input class="num" id="reps-${s.id}" data-in="set-reps" data-we="${we.id}" data-set="${s.id}" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off"
        value="${s.reps == null ? '' : s.reps}" placeholder="${p.reps == null ? '' : p.reps}" aria-label="Herhalingen, ${lab}">
      <button type="button" class="check" data-act="toggle-done" data-we="${we.id}" data-set="${s.id}" aria-pressed="${s.done}" aria-label="${cap(lab)} afvinken">${s.done ? ICON.check : ''}</button>
    </div>`;
  }).join('');
  const showNote = noteShown(we);
  return `<article class="card ex-card">
    <div class="ex-head">
      <button type="button" class="ex-title" data-act="toggle-open" data-we="${we.id}" aria-expanded="true">${esc(exName(we.exerciseId))}</button>
      <button type="button" class="icon-btn" data-act="ex-info" data-id="${we.exerciseId}" aria-label="Uitleg en spieren van ${esc(exName(we.exerciseId))}">${ICON.info}</button>
      <button type="button" class="icon-btn" data-act="ex-menu" data-we="${we.id}" aria-label="Opties voor ${esc(exName(we.exerciseId))}">${ICON.dots}</button>
    </div>
    <div class="ex-info">
      <div class="min0">
        <div class="ex-sub">${pww ? 'Vorige: ' + wwText(pww) : 'Nog geen eerdere data'} · rust ${fmtClock(restFor(we))}</div>
        ${(() => { const act = exAct(ex); const m3 = byLevel(act, 3), m2 = byLevel(act, 2), m1 = byLevel(act, 1);
          return m3.length ? `<div class="ex-muscles"><div><span class="dot l3"></span><strong>${esc(m3.map(r => R_NAME[r]).join(', '))}</strong></div>
            ${m2.length + m1.length ? `<div class="muted">+ ${m2.length + m1.length} spier${m2.length + m1.length === 1 ? '' : 'en'} die meewerk${m2.length + m1.length === 1 ? 't' : 'en'} · <button type="button" class="link-inline" data-act="ex-info" data-id="${we.exerciseId}">bekijk</button></div>` : ''}</div>` : ''; })()}
      </div>
      <div class="mini-map">${bodySvg(actStates(exAct(ex)), viewFor(exAct(ex)))}</div>
    </div>
    <div class="set-row set-head" aria-hidden="true"><span>Set</span><span>${unit}</span><span>Herh.</span><span></span></div>
    ${rows}
    <div class="ex-actions">
      <button type="button" class="btn btn-dashed" data-act="add-set" data-we="${we.id}">+ Set</button>
      <button type="button" class="btn btn-soft" data-act="toggle-note" data-we="${we.id}">${showNote ? 'Opmerking verbergen' : 'Opmerking'}</button>
    </div>
    ${showNote ? `<div class="note"><label class="sr" for="note-${we.id}">Opmerking bij ${esc(exName(we.exerciseId))}</label>
      <textarea id="note-${we.id}" data-in="note" data-we="${we.id}" rows="2" placeholder="Bijv. stoelstand 4, laatste herhaling was zwaar">${esc(we.note)}</textarea></div>` : ''}
  </article>`;
}
function noteShown(we) { const o = ui.noteOpen[we.id]; return o === true || (!!we.note && o !== false); }
function exerciseCollapsed(we) {
  const n = we.sets.length, d = we.sets.filter(s => s.done).length;
  const all = n > 0 && d === n;
  return `<button type="button" class="card ex-collapsed${all ? ' all-done' : ''}" data-act="toggle-open" data-we="${we.id}" aria-expanded="false">
    <span class="min0 ellipsis">${esc(exName(we.exerciseId))}</span>
    <span class="count">${all ? ICON.check : ''}${d} / ${n} sets</span>
  </button>`;
}

/* ---------- Voortgang ---------- */
function progressView() {
  const p = ui.period;
  const ps = periodStart(new Date(), p), pe = addPeriod(ps, p, 1);
  const fin = finishedWorkouts();
  const inP = fin.filter(w => { const d = new Date(w.startedAt); return d >= ps && d < pe; });
  const sets = inP.reduce((n, w) => n + w.exercises.reduce((m, we) => m + we.sets.filter(isWorkingSet).length, 0), 0);
  const recs = inP.reduce((n, w) => n + recordsIn(w).length, 0);
  const lastUse = new Map();
  fin.forEach(w => w.exercises.forEach(we => { if (workingWeight(we)) lastUse.set(we.exerciseId, w.startedAt); }));
  const opts = [...lastUse.entries()].sort((a, b) => b[1].localeCompare(a[1])).map(e => e[0]);
  if (!opts.includes(ui.progressEx)) { ui.progressEx = opts[0] || null; ui.ptSel = null; }
  const periodWord = p === 'week' ? 'deze week' : 'deze maand';
  const head = `
    <header class="stack"><h1>Voortgang</h1></header>
    <div class="segmented" role="group" aria-label="Periode">
      <button type="button" data-act="period" data-p="week" aria-pressed="${p === 'week'}">Per week</button>
      <button type="button" data-act="period" data-p="month" aria-pressed="${p === 'month'}">Per maand</button>
    </div>
    <div class="tiles">
      <div class="tile"><div class="v">${inP.length}</div><div class="l">trainingen ${periodWord}</div></div>
      <div class="tile"><div class="v">${sets}</div><div class="l">werksets ${periodWord}</div></div>
      <div class="tile"><div class="v">${recs}</div><div class="l">records ${periodWord}</div></div>
    </div>`;
  const mc = muscleCard(inP, p, periodWord);
  if (!opts.length) {
    return head + `<div class="card empty"><strong>Nog geen voortgang</strong><p>Rond je eerste training af. Daarna zie je hier per oefening hoe je werkset-gewicht zich ontwikkelt.</p></div>` + mc;
  }
  const sess = sessionsFor(ui.progressEx);
  return head + `
    <div class="card stack">
      <div class="field"><label for="progress-ex">Oefening</label>
        <select class="select" id="progress-ex" data-ch="progress-ex">${opts.map(id => `<option value="${id}" ${id === ui.progressEx ? 'selected' : ''}>${esc(exName(id))}</option>`).join('')}</select>
      </div>
      ${progressChart(sess, p)}
    </div>
    <h2>Trainingen met ${esc(exName(ui.progressEx))}</h2>
    <div class="card rows" style="padding-block:4px">${sessionRows(sess)}</div>
    ${mc}`;
}
function muscleCard(ws, p, periodWord) {
  const load = muscleLoad(ws);
  const ids = REGIONS.map(r => r[0]).filter(id => load[id] > 0);
  const f = p === 'week' ? 1 : 4;
  const lv = v => v >= 8 * f ? 'l3' : v >= 4 * f ? 'l2' : 'l1';
  const st = {}; ids.forEach(id => st[id] = lv(load[id]));
  const leg = p === 'week' ? ['minder dan 4', '4 tot 8', '8 of meer'] : ['minder dan 16', '16 tot 32', '32 of meer'];
  const groups = [...new Set(ids.map(id => R_GROUP[id]))];
  const r1 = v => fmtNum(Math.round(v * 10) / 10);
  return `<div class="card stack">
    <strong>Getrainde spieren ${periodWord}</strong>
    ${bodySvg(st, { caps: true, label: ids.length ? 'Getrainde spieren: ' + ids.map(id => R_NAME[id]).join(', ') : 'Nog geen spieren getraind' })}
    <div class="legend"><span><i style="background:var(--m-1)"></i>${leg[0]}</span><span><i style="background:var(--m-2)"></i>${leg[1]}</span><span><i style="background:var(--m-3)"></i>${leg[2]} sets per spierdeel</span></div>
    ${ids.length ? groups.map(g => `<div class="pick-group"><h4>${g}</h4><div class="rows muscle-rows">${ids.filter(id => R_GROUP[id] === g).sort((a, b) => load[b] - load[a]).map(id => `<div><span><span class="dot ${st[id]}"></span>${R_NAME[id]}</span><strong>${r1(load[id])} ${load[id] === 1 ? 'set' : 'sets'}</strong></div>`).join('')}</div></div>`).join('') + `
    <p class="muted" style="margin:0;font-size:13px">Een werkset telt volledig voor de hoofdspier, half voor een spier die sterk meewerkt en voor een kwart voor een spier die meehelpt.</p>`
    : `<p class="muted" style="margin:0">Nog geen werksets ${periodWord}.</p>`}
  </div>`;
}
function progressChart(sess, p) {
  const cur = periodStart(new Date(), p);
  const firstP = periodStart(new Date(sess[0].w.startedAt), p);
  let slots = [];
  for (let d = new Date(firstP); d <= cur; d = addPeriod(d, p, 1)) slots.push(new Date(d));
  if (slots.length > 12) slots = slots.slice(-12);
  if (slots.length < 2) slots = [addPeriod(slots[0], p, -1), slots[0]];
  const pts = [];
  slots.forEach((s, i) => {
    const e = addPeriod(s, p, 1);
    const inS = sess.filter(x => { const d = new Date(x.w.startedAt); return d >= s && d < e; });
    if (!inS.length) return;
    let best = inS[0];
    inS.forEach(x => { if (x.ww.kg > best.ww.kg || (x.ww.kg === best.ww.kg && x.w.startedAt > best.w.startedAt)) best = x; });
    pts.push({ i, kg: best.ww.kg, s: best, label: periodLabel(s, p) });
  });
  if (!pts.length) return '<p class="muted">Geen data in deze periode.</p>';
  if (ui.ptSel == null || ui.ptSel >= pts.length) ui.ptSel = pts.length - 1;
  const W = 340, H = 180, L = 44, R = 14, T = 14, B = 28;
  const vals = pts.map(x => x.kg);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const step = hi - lo > 40 ? 10 : 2.5;
  lo = Math.max(0, Math.floor((lo - step) / step) * step); hi = Math.ceil((hi + step) / step) * step;
  if (hi === lo) hi = lo + step * 2;
  const x = i => L + (slots.length === 1 ? 0 : i * (W - L - R) / (slots.length - 1));
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const mid = (lo + hi) / 2;
  const ticks = [lo, mid, hi];
  const grid = ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="axis-t" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(Math.round(v * 10) / 10)}</text>`).join('');
  const every = Math.ceil(slots.length / 6);
  const xl = slots.map((s, i) => (i % every === 0 || i === slots.length - 1) && !(i !== slots.length - 1 && slots.length - 1 - i < every && i % every === 0 && slots.length - 1 - i < every / 2)
    ? `<text class="axis-t" x="${x(i)}" y="${H - 8}" text-anchor="middle">${periodLabel(s, p)}</text>` : '').join('');
  const line = pts.map((pt, k) => (k ? 'L' : 'M') + x(pt.i).toFixed(1) + ' ' + y(pt.kg).toFixed(1)).join(' ');
  const area = pts.length > 1 ? `<path class="area" d="${line} L${x(pts[pts.length - 1].i).toFixed(1)} ${H - B} L${x(pts[0].i).toFixed(1)} ${H - B} Z"/>` : '';
  const colW = (W - L - R) / Math.max(1, slots.length - 1);
  const dots = pts.map((pt, k) => `<circle class="dot${k === ui.ptSel ? ' sel' : ''}" cx="${x(pt.i)}" cy="${y(pt.kg)}" r="${k === ui.ptSel ? 6 : 4.5}"/>`).join('');
  const hits = pts.map((pt, k) => `<rect class="hit" x="${x(pt.i) - Math.max(14, colW / 2)}" y="${T - 10}" width="${Math.max(28, colW)}" height="${H - T - B + 20}" tabindex="0" role="button" data-act="pt" data-k="${k}" aria-label="${pt.label}: ${fmtNum(pt.kg)} kilo"/>`).join('');
  const sel = pts[ui.ptSel];
  const first = pts[0], last = pts[pts.length - 1];
  const diff = last.kg - first.kg;
  const diffTxt = pts.length < 2 ? '' : diff > 0 ? `<span class="delta-up">+${fmtNum(diff)} kg</span> sinds ${first.label}` : diff < 0 ? `${fmtNum(diff)} kg sinds ${first.label}` : `gelijk sinds ${first.label}`;
  return `<div class="chart">
    <div class="row-between"><strong>Werkset-gewicht</strong><span style="font-size:14px">${diffTxt}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Werkset-gewicht per ${p === 'week' ? 'week' : 'maand'} voor ${esc(exName(ui.progressEx))}">${grid}${area}<path class="line" d="${line}"/>${dots}${xl}${hits}</svg>
    <div class="chart-info"><strong>${sel.label}</strong> · ${wwText(sel.s.ww)} <span class="muted">(${fmtDateShort(sel.s.w.startedAt)})</span></div>
  </div>`;
}
function sessionRows(sess) {
  let best = null;
  const rows = sess.map(x => { const rec = best != null && x.ww.kg > best; if (best == null || x.ww.kg > best) best = x.ww.kg; return { x, rec }; });
  return rows.slice(-10).reverse().map(({ x, rec }) => `<div>
    <span class="muted" style="font-size:14px">${fmtDateShort(x.w.startedAt)}</span>
    <span>${rec ? `<span class="badge">${ICON.star}Record</span> ` : ''}<strong>${fmtNum(x.ww.kg)} kg</strong> <span class="muted">× ${x.ww.list.join(' · ')}</span></span>
  </div>`).join('');
}

/* ---------- Historie ---------- */
function historyView() {
  const fin = finishedWorkouts().slice().reverse();
  if (!fin.length) return `<header class="stack"><h1>Historie</h1></header><div class="card empty"><strong>Nog geen trainingen</strong><p>Afgeronde trainingen komen hier te staan. Je kunt ze achteraf openen en aanpassen.</p></div>`;
  let html = '<header class="stack"><h1>Historie</h1></header>';
  let curM = '';
  fin.forEach(w => {
    const d = new Date(w.startedAt);
    const m = cap(MONTHS[d.getMonth()]) + ' ' + d.getFullYear();
    if (m !== curM) { if (curM) html += '</div>'; html += `<h2>${m}</h2><div class="stack">`; curM = m; }
    const sets = w.exercises.reduce((n, we) => n + we.sets.filter(isWorkingSet).length, 0);
    const recs = recordsIn(w).length;
    html += `<button type="button" class="card hist-item" data-act="open-workout" data-id="${w.id}">
      <span class="hist-day"><span class="w">${DAYS[d.getDay()].slice(0, 2)}</span><br><span class="d">${d.getDate()}</span></span>
      <span class="list-card min0" style="gap:2px">
        <span class="name ellipsis">${esc(w.name)}</span>
        <span class="meta">${w.exercises.length} oef. · ${sets} werksets · ${fmtDuration(new Date(w.endedAt) - d)}</span>
        ${recs ? `<span><span class="badge">${ICON.star}${recs} record${recs > 1 ? 's' : ''}</span></span>` : ''}
      </span>
    </button>`;
  });
  return html + '</div>';
}

    <header class="stack"><h1>Schema's</h1></header>

      ${tpls.map(t => `<button type="button" class="card list-card" data-act="edit-template" data-id="${t.id}">
        <span class="name">${esc(t.name || 'Naamloos schema')}</span>
        <span class="meta">${t.items.length ? esc(t.items.map(i => exName(i.exerciseId)).join(', ')) : 'Nog geen oefeningen'}</span>
      </button>`).join('')}
      <button type="button" class="btn btn-dashed btn-lg" data-act="new-template">+ Nieuw schema</button>
    </div>
    <h2>Instellingen</h2>
    <div class="card stack">
      <div class="field"><label for="set-rest">Standaard rusttijd</label>
        <select class="select" id="set-rest" data-ch="set-rest">${restOpts.map(v => `<option value="${v}" ${v === s.defaultRest ? 'selected' : ''}>${fmtClock(v)} min</option>`).join('')}</select>
      </div>
      <label class="toggle-row" for="set-awake"><span>Scherm aan houden tijdens training</span><input type="checkbox" id="set-awake" data-ch="set-awake" ${s.keepAwake ? 'checked' : ''}></label>
      <div class="field"><label for="set-theme">Weergave</label>
        <select class="select" id="set-theme" data-ch="set-theme">

          <option value="light" ${s.theme === 'light' ? 'selected' : ''}>Licht</option>
          <option value="dark" ${s.theme === 'dark' ? 'selected' : ''}>Donker</option>
        </select>
      </div>
    </div>
    <h2>Back-up</h2>
    <div class="card stack">
      <p style="margin:0" class="muted">Je trainingen staan alleen op deze telefoon. Bewaar af en toe een back-up in Bestanden of iCloud Drive. Laatste back-up: <strong style="color:var(--ink)">${last ? fmtDateShort(last) : 'nog nooit'}</strong>.</p>
      <button type="button" class="btn btn-accent btn-lg" data-act="backup">Back-up maken</button>

      <input type="file" id="restore-file" class="sr" accept="application/json,.json" data-ch="restore">

function templateEditor(t) {
  const restOpts = [0, 45, 60, 75, 90, 120, 150, 180, 240, 300];
  const items = t.items.map((it, i) => `<article class="card tpl-item">
    <div class="ex-head" style="margin:-6px -8px -2px 0">
      <span class="ex-title" style="padding:6px 0">${esc(exName(it.exerciseId))}</span>
      <button type="button" class="icon-btn" data-act="item-move" data-item="${it.id}" data-d="-1" aria-label="Omhoog" ${i === 0 ? 'disabled style="opacity:.3"' : ''}>${ICON.up}</button>
      <button type="button" class="icon-btn" data-act="item-move" data-item="${it.id}" data-d="1" aria-label="Omlaag" ${i === t.items.length - 1 ? 'disabled style="opacity:.3"' : ''}>${ICON.down}</button>
      <button type="button" class="icon-btn" data-act="item-remove" data-item="${it.id}" aria-label="${esc(exName(it.exerciseId))} verwijderen">${ICON.trash}</button>
    </div>
    <div class="tpl-grid">
      <div class="field"><span>Opwarmsets</span>${stepper(it, 'warmups', 0, 5)}</div>
      <div class="field"><span>Werksets</span>${stepper(it, 'sets', 1, 10)}</div>
      <div class="field"><label for="reps-${it.id}">Doel herhalingen</label>
        <input class="text" id="reps-${it.id}" data-in="item-reps" data-item="${it.id}" inputmode="numeric" pattern="[0-9]*" placeholder="bijv. 8" value="${it.reps || ''}"></div>
      <div class="field"><label for="rest-${it.id}">Rust</label>
        <select class="select" id="rest-${it.id}" data-ch="item-rest" data-item="${it.id}">${restOpts.map(v => `<option value="${v}" ${(it.restSec || 0) === v ? 'selected' : ''}>${v ? fmtClock(v) + ' min' : 'Standaard (' + fmtClock(db.settings.defaultRest) + ')'}</option>`).join('')}</select></div>
    </div>
  </article>`).join('');
  return `
    <button type="button" class="link-back" data-act="close-template">‹ Schema's</button>
    <header class="stack">
      <label class="eyebrow" for="t-name">Naam van het schema</label>
      <input class="title-input" id="t-name" data-in="t-name" value="${esc(t.name)}" placeholder="Bijv. Push A" autocomplete="off">
    </header>
    <section class="stack">
      ${items || '<div class="card empty"><p>Voeg de oefeningen toe die je op deze dag doet.</p></div>'}
      <button type="button" class="btn btn-dashed btn-lg" data-act="pick-ex" data-target="template">+ Oefening toevoegen</button>
      ${t.items.length && !activeWorkout() ? `<button type="button" class="btn btn-accent btn-lg" data-act="start-template" data-id="${t.id}">Start deze training</button>` : ''}
      <button type="button" class="btn-text danger" data-act="delete-template" data-id="${t.id}">Schema verwijderen</button>
    </section>`;
}
function stepper(it, field, min, max) {
  const v = it[field] || 0;
  return `<div class="stepper">
    <button type="button" data-act="item-step" data-item="${it.id}" data-field="${field}" data-d="-1" aria-label="Minder" ${v <= min ? 'disabled' : ''}>−</button>
    <output>${v}</output>
    <button type="button" data-act="item-step" data-item="${it.id}" data-field="${field}" data-d="1" aria-label="Meer" ${v >= max ? 'disabled' : ''}>+</button>
  </div>`;
}

/* ---------- Sheets (pop-ups van onderen) ---------- */
function renderSheet() {
  const root = $('#sheet-root');
  const s = ui.sheet;
  if (!s) { root.innerHTML = ''; return; }
  root.innerHTML = `<div class="sheet-backdrop" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-inner"><div class="grabber"></div>${sheetHtml(s)}</div></div>`;
  const f = root.querySelector('[data-autofocus]');
  if (f) setTimeout(() => f.focus(), 50);
}
function confirmSheet(title, text, yesAct, yesLabel, extra) {
  return `<h3 id="sheet-title">${title}</h3>${text ? `<p>${text}</p>` : ''}
    <button type="button" class="btn btn-lg ${extra && extra.danger ? 'btn-dark' : 'btn-accent'}" data-act="${yesAct}" ${extra && extra.id ? `data-id="${extra.id}"` : ''}>${yesLabel}</button>
    <button type="button" class="btn btn-soft btn-lg" data-act="close-sheet">${extra && extra.no ? extra.no : 'Annuleren'}</button>`;
}
function sheetHtml(s) {
  if (s.type === 'set') {
    const loc = locateWE(s.weId); if (!loc) return '';
    const set = loc.we.sets.find(x => x.id === s.setId); if (!set) return '';
    return `<h3 id="sheet-title">${set.warmup ? 'Opwarmset' : 'Werkset'}</h3>
      <p>Opwarmsets tellen niet mee voor je voortgang.</p>
      <button type="button" class="btn btn-soft btn-lg" data-act="set-warm">${set.warmup ? 'Maak er een werkset van' : 'Maak er een opwarmset van'}</button>
      <button type="button" class="btn btn-soft btn-lg" data-act="set-delete" style="color:var(--danger)">Set verwijderen</button>
      <button type="button" class="btn-text" data-act="close-sheet">Annuleren</button>`;
  }
  if (s.type === 'ex') {
    const loc = locateWE(s.weId); if (!loc) return '';
    const { w, we } = loc;
    const i = w.exercises.indexOf(we);
    const doneN = we.sets.filter(x => x.done).length;
    if (s.confirmRemove) return confirmSheet('Oefening verwijderen?', `${esc(exName(we.exerciseId))} en ${doneN} afgevinkte set${doneN === 1 ? '' : 's'} worden uit deze training gehaald.`, 'ex-remove-yes', 'Ja, verwijderen', { danger: true });
    const restOpts = [45, 60, 75, 90, 120, 150, 180, 240, 300];
    return `<h3 id="sheet-title">${esc(exName(we.exerciseId))}</h3>
      <div class="field"><label for="we-rest">Rusttijd bij deze oefening</label>
        <select class="select" id="we-rest" data-ch="we-rest">${restOpts.map(v => `<option value="${v}" ${restFor(we) === v ? 'selected' : ''}>${fmtClock(v)} min</option>`).join('')}</select></div>
      <div class="tpl-grid">
        <button type="button" class="btn btn-soft btn-lg" data-act="ex-move" data-d="-1" ${i === 0 ? 'disabled style="opacity:.4"' : ''}>${ICON.up} Omhoog</button>
        <button type="button" class="btn btn-soft btn-lg" data-act="ex-move" data-d="1" ${i === w.exercises.length - 1 ? 'disabled style="opacity:.4"' : ''}>${ICON.down} Omlaag</button>
      </div>
      <button type="button" class="btn btn-soft btn-lg" data-act="muscle-edit" data-id="${we.exerciseId}">Spieren aanpassen</button>
      <button type="button" class="btn btn-soft btn-lg" data-act="ex-remove" style="color:var(--danger)">Verwijderen uit deze training</button>
      <button type="button" class="btn-text" data-act="close-sheet">Sluiten</button>`;
  }
  if (s.type === 'picker') {
    if (s.creating) {
      return `<h3 id="sheet-title">Nieuwe oefening</h3>
        <div class="field"><label for="pk-name">Naam</label><input class="text" id="pk-name" value="${esc(s.newName)}" data-in="pk-name" autocomplete="off" ${s.focusName ? 'data-autofocus' : ''}></div>
        <div class="tpl-grid">
          <div class="field"><label for="pk-muscle">Spiergroep</label><select class="select" id="pk-muscle" data-ch="pk-muscle">${MUSCLES.map(m => `<option ${m === s.group ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
          <div class="field"><label for="pk-equip">Soort</label><select class="select" id="pk-equip" data-ch="pk-equip">${Object.entries(EQUIP).map(([k, v]) => `<option value="${k}" ${k === s.equip ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
        </div>
        <p style="font-size:14px">Bij dumbbell vul je het gewicht per hand in.</p>
        <strong>Welke spieren train je?</strong>
        ${actEditor(s.act)}
        <button type="button" class="btn btn-accent btn-lg" data-act="picker-save-new">Oefening opslaan en toevoegen</button>
        <button type="button" class="btn-text" data-act="picker-back">Terug naar de lijst</button>`;
    }
    return `<h3 id="sheet-title">Oefening toevoegen</h3>
      <label class="sr" for="pk-q">Zoek een oefening</label>
      <input class="text" id="pk-q" type="search" placeholder="Zoek, bijv. curl" value="${esc(s.q)}" data-in="picker-q" autocomplete="off">
      <div class="chips" role="group" aria-label="Spiergroep">
        <button type="button" class="chip" data-act="picker-muscle" data-m="" aria-pressed="${!s.muscle}">Alles</button>
        ${MUSCLES.map(m => `<button type="button" class="chip" data-act="picker-muscle" data-m="${m}" aria-pressed="${s.muscle === m}">${m}</button>`).join('')}
      </div>
      <div id="picker-list">${pickerList()}</div>`;
  }
  if (s.type === 'finish') {
    const w = activeWorkout(); if (!w) return '';
    const done = w.exercises.reduce((n, we) => n + we.sets.filter(x => x.done).length, 0);
    const open = w.exercises.reduce((n, we) => n + we.sets.filter(x => !x.done).length, 0);
    if (!done) return confirmSheet('Nog niets afgevinkt', 'Vink sets af met ✓ om ze op te slaan. Wil je de training stoppen zonder op te slaan?', 'cancel-yes', 'Stoppen zonder opslaan', { danger: true, no: 'Verder trainen' });
    return `<h3 id="sheet-title">Training afronden?</h3>
      <p>${done} set${done === 1 ? '' : 's'} afgevinkt.${open ? ` ${open} set${open === 1 ? ' is' : 's zijn'} niet afgevinkt en ${open === 1 ? 'wordt' : 'worden'} niet opgeslagen.` : ''}</p>
      <button type="button" class="btn btn-accent btn-lg" data-act="finish-yes">Training opslaan</button>
      <button type="button" class="btn btn-soft btn-lg" data-act="close-sheet">Verder trainen</button>`;
  }
  if (s.type === 'summary') {
    const w = getWorkout(s.workoutId); if (!w) return '';
    const sets = w.exercises.reduce((n, we) => n + we.sets.filter(isWorkingSet).length, 0);
    const recs = recordsIn(w);
    return `<h3 id="sheet-title">Training opgeslagen</h3>
      <div class="tiles">
        <div class="tile" style="background:var(--soft)"><div class="v">${fmtDuration(new Date(w.endedAt) - new Date(w.startedAt))}</div><div class="l">duur</div></div>
        <div class="tile" style="background:var(--soft)"><div class="v">${w.exercises.length}</div><div class="l">oefeningen</div></div>
        <div class="tile" style="background:var(--soft)"><div class="v">${sets}</div><div class="l">werksets</div></div>
      </div>
      ${(() => { const mx = {}; w.exercises.forEach(we => { if (!we.sets.some(isWorkingSet)) return; const act = exAct(getEx(we.exerciseId)); Object.keys(act).forEach(r => { mx[r] = Math.max(mx[r] || 0, act[r]); }); });
        return Object.keys(mx).length ? bodySvg(actStates(mx), { caps: true, label: 'Getrainde spieren in deze training' }) + actLegend() : ''; })()}
      ${recs.length ? `<div class="rows">${recs.map(r => `<div><span><span class="badge">${ICON.star}Record</span> ${esc(exName(r.exerciseId))}</span><strong>${fmtNum(r.kg)} kg</strong></div>`).join('')}</div>` : ''}
      <button type="button" class="btn btn-accent btn-lg" data-act="goto-progress">Bekijk voortgang</button>
      <button type="button" class="btn btn-soft btn-lg" data-act="close-sheet">Sluiten</button>`;
  }
  if (s.type === 'cancel') return confirmSheet('Training stoppen?', 'Alles wat je in deze training hebt ingevuld wordt verwijderd.', 'cancel-yes', 'Ja, stoppen', { danger: true, no: 'Verder trainen' });
  if (s.type === 'delete-workout') return confirmSheet('Training verwijderen?', 'Deze training verdwijnt uit je historie en voortgang.', 'delete-workout-yes', 'Ja, verwijderen', { danger: true });
  if (s.type === 'delete-template') return confirmSheet('Schema verwijderen?', 'Je trainingen blijven bewaard, alleen het schema verdwijnt.', 'delete-template-yes', 'Ja, verwijderen', { danger: true });
  if (s.type === 'restore') {
    const d = s.data;
    const n = live(d.workouts || []).filter(w => w.endedAt).length;
    return `<h3 id="sheet-title">Back-up terugzetten</h3>
      <p>Deze back-up bevat ${n} training${n === 1 ? '' : 'en'} en ${live(d.templates || []).length} schema${live(d.templates || []).length === 1 ? '' : "'s"}.</p>
      <button type="button" class="btn btn-accent btn-lg" data-act="restore-merge">Samenvoegen met wat er nu staat</button>
      <button type="button" class="btn btn-soft btn-lg" data-act="restore-replace" style="color:var(--danger)">Alles vervangen door de back-up</button>
      <button type="button" class="btn-text" data-act="close-sheet">Annuleren</button>`;
  }
  if (s.type === 'exinfo') {
    const ex = getEx(s.exId); if (!ex) return '';
    const act = exAct(ex), vf = viewFor(act), info = exInfo(ex);
    return `<h3 id="sheet-title">${esc(ex.name)}</h3>
      ${info ? `<div class="info-box">${ICON.info}<p>${esc(info)}</p></div>` : ''}
      <div class="big-map">${bodySvg(actStates(act), Object.assign({ caps: true, label: 'Getrainde spieren: ' + Object.keys(act).map(r => R_NAME[r]).join(', ') }, vf))}</div>
      ${vf.view !== 'both' || vf.crop ? `<details class="more"><summary>Hele lichaam bekijken</summary>${bodySvg(actStates(act), { caps: true })}</details>` : ''}
      ${actLegend()}
      ${[3, 2, 1].map(l => { const rs = byLevel(act, l); return rs.length ? `<div class="pick-group"><h4><span class="dot l${l}"></span>${LEVEL_NAME[l]}</h4><p style="margin:0;color:var(--ink)">${rs.map(r => esc(R_NAME[r])).join(', ')}</p></div>` : ''; }).join('')}
      <button type="button" class="btn btn-soft btn-lg" data-act="muscle-edit" data-id="${ex.id}">Spieren aanpassen</button>
      <button type="button" class="btn-text" data-act="close-sheet">Sluiten</button>`;
  }
  if (s.type === 'muscles') {
    const ex = getEx(s.exId); if (!ex) return '';
    const slug = String(ex.id).startsWith('lib-') ? ex.id.slice(4) : null;
    return `<h3 id="sheet-title">Spieren van ${esc(ex.name)}</h3>
      ${actEditor(s.act)}
      <button type="button" class="btn btn-accent btn-lg" data-act="muscle-save">Opslaan</button>
      ${slug && EX_ACT[slug] ? '<button type="button" class="btn btn-soft btn-lg" data-act="muscle-reset">Standaard herstellen</button>' : ''}
      <button type="button" class="btn-text" data-act="close-sheet">Annuleren</button>`;
  }
  if (s.type === 'info') return `<h3 id="sheet-title">${s.title}</h3><p>${s.text}</p><button type="button" class="btn btn-soft btn-lg" data-act="close-sheet">Oké</button>`;
  return '';
}
function pickerList() {
  const s = ui.sheet;
  const q = (s.q || '').trim().toLowerCase();
  const list = live(db.exercises).filter(e => (!s.muscle || e.muscle === s.muscle) && (!q || e.name.toLowerCase().includes(q)))
    .sort((a, b) => a.name.localeCompare(b.name, 'nl'));
  let present = new Set();
  if (s.target === 'workout') { const w = getWorkout(ui.ctxWorkoutId); if (w) present = new Set(w.exercises.map(x => x.exerciseId)); }
  else { const t = getTemplate(ui.editingTemplateId); if (t) present = new Set(t.items.map(x => x.exerciseId)); }
  let html = '';
  MUSCLES.forEach(m => {
    const g = list.filter(e => e.muscle === m);
    if (!g.length) return;
    html += `<div class="pick-group"><h4>${m}</h4>${g.map(e => `<button type="button" class="pick-item" data-act="picker-choose" data-id="${e.id}">
      <span>${esc(e.name)}</span><small>${present.has(e.id) ? 'al toegevoegd' : esc(mainText(exAct(e)) || EQUIP[e.equipment] || '')}</small></button>`).join('')}</div>`;
  });
  if (!list.length) html += `<p style="margin:12px 0 4px">Geen oefening gevonden${q ? ' voor “' + esc(s.q) + '”' : ''}.</p>`;
  html += `<button type="button" class="btn btn-dashed btn-block" style="margin-top:12px" data-act="picker-new">+ Nieuwe oefening${q ? ' “' + esc(s.q) + '”' : ''} maken</button>`;
  return html;
}

/* ================= Rusttimer ================= */
let rest = (() => { try { const r = JSON.parse(sessionStorage.getItem(REST_KEY) || localStorage.getItem(REST_KEY) || 'null'); return r && r.endsAt ? r : null; } catch (e) { return null; } })();
function saveRest() { try { if (rest) localStorage.setItem(REST_KEY, JSON.stringify(rest)); else localStorage.removeItem(REST_KEY); } catch (e) { } }
function startRest(sec) { rest = { endsAt: Date.now() + sec * 1000, total: sec, fired: false }; saveRest(); unlockAudio(); renderRest(); }
function stopRest() { rest = null; saveRest(); renderRest(); }
function renderRest() {
  const el = $('#restbar');
  const show = !!rest && !!activeWorkout();
  el.hidden = !show;
  document.body.classList.toggle('has-rest', show);
  if (!show) { el.innerHTML = ''; return; }
  const rem = (rest.endsAt - Date.now()) / 1000;
  const over = rem <= 0;
  el.innerHTML = `<div class="restbar-inner${over ? ' done' : ''}">
    <div class="restbar-fill" id="rest-fill" style="width:${over ? 100 : Math.max(0, 100 - rem / rest.total * 100)}%"></div>
    <span style="position:relative">${over ? '<strong>Rust voorbij, volgende set</strong>' : `Rust <span class="t" id="rest-time">${fmtClock(rem)}</span>`}</span>
    <div class="acts">${over ? '<button type="button" data-act="rest-skip">Sluiten</button>' : '<button type="button" data-act="rest-add">+30s</button><button type="button" data-act="rest-skip">Overslaan</button>'}</div>
  </div>`;
}
let actx = null;
function unlockAudio() {
  try {
    if (navigator.audioSession && navigator.audioSession.type !== 'playback') navigator.audioSession.type = 'playback';
  } catch (e) { }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!actx && AC) actx = new AC();
    if (actx && actx.state === 'suspended') actx.resume();
  } catch (e) { }
}
function alarm() {
  try { if (navigator.vibrate) navigator.vibrate([250, 120, 250]); } catch (e) { }
  if (!actx) return;
  try {
    const t0 = actx.currentTime + 0.02;
    [0, 0.28, 0.56].forEach((d, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t0 + d);
      g.gain.exponentialRampToValueAtTime(0.5, t0 + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + d); o.stop(t0 + d + 0.25);
    });
  } catch (e) { }
}
function updateClocks() {
  const w = activeWorkout();
  const el = $('#elapsed');
  if (el && w) el.textContent = fmtElapsed(Date.now() - new Date(w.timerStart || w.startedAt).getTime());
  if (rest && w) {
    const rem = (rest.endsAt - Date.now()) / 1000;
    if (rem <= 0 && !rest.fired) {
      rest.fired = true; saveRest(); alarm(); renderRest();
      const mine = rest;
      setTimeout(() => { if (rest === mine) stopRest(); }, 10000);
    } else if (rem > 0) {
      const t = $('#rest-time'); if (t) t.textContent = fmtClock(rem);
      const f = $('#rest-fill'); if (f) f.style.width = Math.max(0, 100 - rem / rest.total * 100) + '%';
    }
  }
}
setInterval(updateClocks, 250);

/* Scherm aan houden */
let wakeLock = null;
async function syncWakeLock() {
  const want = !!activeWorkout() && db.settings.keepAwake && document.visibilityState === 'visible';
  try {
    if (want && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!want && wakeLock) { const l = wakeLock; wakeLock = null; await l.release(); }
  } catch (e) { wakeLock = null; }
}

/* ================= Back-up ================= */
async function doBackup() {
  const payload = { app: 'trainingslog', format: 1, exportedAt: nowIso(), data: db };
  const json = JSON.stringify(payload);
  const name = 'trainingslog-backup-' + todayStr() + '.json';
  let ok = false;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Trainingslog back-up' });
      ok = true;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!ok && !inFrame) {
    try {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      ok = true;
    } catch (e) { }
  }
  if (ok) { db.meta.lastBackupAt = nowIso(); persist(); toast('Back-up gemaakt'); render(); }
  else { ui.sheet = { type: 'info', title: 'Back-up lukt hier niet', text: 'In deze voorbeeldversie kan de app geen bestand bewaren. Op je telefoon (via de link van GitHub Pages) werkt de back-upknop wel.' }; renderSheet(); }
}
function handleRestoreFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      const data = parsed && parsed.data ? parsed.data : parsed;
      if (!data || !Array.isArray(data.workouts) || !Array.isArray(data.exercises)) throw new Error('vorm');
      ui.sheet = { type: 'restore', data };
      renderSheet();
    } catch (e) { toast('Dit bestand is geen Trainingslog-back-up'); }
  };
  r.onerror = () => toast('Het bestand kon niet worden gelezen');
  r.readAsText(file);
}

let toastTimer = null;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2800);
}

/* ================= Acties ================= */
function startWorkout(t) {
  if (activeWorkout()) { ui.tab = 'training'; render(); return; }
  const sd = ui.startDate && ui.startDate <= todayStr() ? ui.startDate : todayStr();
  const startIso = onDate(sd, new Date()).toISOString();
  ui.startDate = null;
  const w = { id: uid(), templateId: t ? t.id : null, name: t ? (t.name || 'Training') : 'Training', startedAt: startIso, timerStart: nowIso(), endedAt: null, exercises: [], updatedAt: nowIso(), deleted: false };
  if (t) t.items.forEach(it => w.exercises.push(makeWE(it.exerciseId, { warmups: it.warmups || 0, sets: it.sets || 3, reps: it.reps, restSec: it.restSec }, w.startedAt)));
  db.workouts.push(w);
  db.meta.activeWorkoutId = w.id;
  ui.openWE = null; ui.noteOpen = {}; ui.tab = 'training'; ui.editingTemplateId = null;
  stopRest(); persist(); unlockAudio(); render(); window.scrollTo(0, 0);
}
function currentTemplate() { return getTemplate(ui.editingTemplateId); }
function findItem(id) { const t = currentTemplate(); return t ? { t, it: t.items.find(i => i.id === id) } : null; }

const actions = {
  'tab'(d) { ui.tab = d.tab; ui.editingWorkoutId = null; ui.editingTemplateId = null; ui.sheet = null; render(); window.scrollTo(0, 0); },
  'close-sheet'() { ui.sheet = null; renderSheet(); },
  'start-template'(d) { const t = getTemplate(d.id); if (t) startWorkout(t); },
  'start-empty'() { startWorkout(null); },
  'toggle-open'(d) { ui.openWE = ui.openWE === d.we ? 'none' : d.we; render(); },
  'toggle-done'(d) {
    const loc = locateWE(d.we); if (!loc) return;
    const { w, we } = loc;
    const idx = we.sets.findIndex(s => s.id === d.set); const s = we.sets[idx]; if (!s) return;
    if (!s.done) {
      const ph = placeholders(w, we)[idx];
      const kg = s.kg != null ? s.kg : ph.kg;
      const reps = s.reps != null ? s.reps : ph.reps;
      if (kg == null || !reps) { toast('Vul eerst gewicht en herhalingen in'); const f = $(kg == null ? '#kg-' + s.id : '#reps-' + s.id); if (f) f.focus(); return; }
      s.kg = kg; s.reps = reps; s.done = true;
      if (w.id === db.meta.activeWorkoutId) {
        const isLastSetOverall = w.exercises.every(x => x.sets.every(y => y.done));
        if (!isLastSetOverall) startRest(restFor(we));
      }
      if (we.sets.every(x => x.done)) {
        const next = w.exercises.find(x => x.sets.some(y => !y.done));
        if (next) ui.openWE = next.id;
      }
    } else s.done = false;
    touch(w); persist(); render();
  },
  'add-set'(d) {
    const loc = locateWE(d.we); if (!loc) return;
    loc.we.sets.push(makeSet(false)); touch(loc.w); persist(); render();
  },
  'toggle-note'(d) {
    const loc = locateWE(d.we); if (!loc) return;
    ui.noteOpen[d.we] = !noteShown(loc.we);
    render();
    const ta = $('#note-' + d.we); if (ta) ta.focus();
  },
  'set-menu'(d) { ui.sheet = { type: 'set', weId: d.we, setId: d.set }; renderSheet(); },
  'set-warm'() {
    const loc = locateWE(ui.sheet.weId); if (!loc) return;
    const s = loc.we.sets.find(x => x.id === ui.sheet.setId); if (!s) return;
    s.warmup = !s.warmup;
    loc.we.sets.sort((a, b) => (b.warmup ? 1 : 0) - (a.warmup ? 1 : 0));
    touch(loc.w); persist(); ui.sheet = null; render();
  },
  'set-delete'() {
    const loc = locateWE(ui.sheet.weId); if (!loc) return;
    loc.we.sets = loc.we.sets.filter(x => x.id !== ui.sheet.setId);
    touch(loc.w); persist(); ui.sheet = null; render();
  },
  'ex-menu'(d) { ui.sheet = { type: 'ex', weId: d.we }; renderSheet(); },
  'ex-move'(d) {
    const loc = locateWE(ui.sheet.weId); if (!loc) return;
    const arr = loc.w.exercises, i = arr.indexOf(loc.we), j = i + Number(d.d);
    if (j < 0 || j >= arr.length) return;
    arr.splice(i, 1); arr.splice(j, 0, loc.we);
    touch(loc.w); persist(); render();
  },
  'ex-remove'() {
    const loc = locateWE(ui.sheet.weId); if (!loc) return;
    if (loc.we.sets.some(s => s.done)) { ui.sheet.confirmRemove = true; renderSheet(); return; }
    actions['ex-remove-yes']();
  },
  'ex-remove-yes'() {
    const loc = locateWE(ui.sheet.weId); if (!loc) return;
    loc.w.exercises = loc.w.exercises.filter(x => x !== loc.we);
    touch(loc.w); persist(); ui.sheet = null; render();
  },
  'pick-ex'(d) { ui.sheet = { type: 'picker', target: d.target, q: '', muscle: null, creating: false }; renderSheet(); },
  'picker-muscle'(d) { ui.sheet.muscle = d.m || null; renderSheet(); },
  'picker-new'() {
    const s = ui.sheet; const g = s.muscle || 'Borst';
    Object.assign(s, { creating: true, newName: s.q || '', group: g, equip: 'barbell', act: Object.assign({}, GROUP_ACT[g]), focusName: true });
    renderSheet(); s.focusName = false;
  },
  'act-tap'(d) {
    const s = ui.sheet; if (!s || !s.act) return;
    const next = { 0: 1, 1: 2, 2: 3, 3: 0 }[s.act[d.r] || 0];
    if (next) s.act[d.r] = next; else delete s.act[d.r];
    const sc = $('.sheet') ? $('.sheet').scrollTop : 0;
    renderSheet(); if ($('.sheet')) $('.sheet').scrollTop = sc;
  },
  'ex-info'(d) { if (getEx(d.id)) { ui.sheet = { type: 'exinfo', exId: d.id }; renderSheet(); } },
  'muscle-edit'(d) {
    const ex = getEx(d.id); if (!ex) return;
    ui.sheet = { type: 'muscles', exId: ex.id, act: Object.assign({}, exAct(ex)) }; renderSheet();
  },
  'muscle-save'() {
    const s = ui.sheet, ex = getEx(s.exId); if (!ex) return;
    if (!byLevel(s.act, 3).length) { toast('Kies minstens één hoofdspier'); return; }
    ex.act = Object.assign({}, s.act); ex.actEdited = !s.reset || JSON.stringify(s.act) !== JSON.stringify(EX_ACT[ex.id.slice(4)] ? EX_ACT[ex.id.slice(4)][0] : null); touch(ex); persist();
    ui.sheet = { type: 'exinfo', exId: ex.id }; toast('Spieren opgeslagen'); render();
  },
  'muscle-reset'() {
    const s = ui.sheet, ex = getEx(s.exId); if (!ex) return;
    s.act = Object.assign({}, EX_ACT[ex.id.slice(4)][0]); s.reset = true; renderSheet();
  },
  'picker-back'() { ui.sheet.creating = false; renderSheet(); },
  'picker-save-new'() {
    const name = (ui.sheet.newName || '').trim();
    if (!name) { toast('Geef de oefening een naam'); $('#pk-name').focus(); return; }
    const dup = live(db.exercises).find(e => e.name.toLowerCase() === name.toLowerCase());
    if (dup) { actions['picker-choose']({ id: dup.id }); toast(dup.name + ' bestond al en is toegevoegd'); return; }
    if (!byLevel(ui.sheet.act, 3).length) { toast('Kies minstens één hoofdspier'); return; }
    const ex = { id: uid(), name, muscle: ui.sheet.group, equipment: ui.sheet.equip, act: Object.assign({}, ui.sheet.act), actEdited: true, custom: true, updatedAt: nowIso(), deleted: false };
    db.exercises.push(ex);
    actions['picker-choose']({ id: ex.id });
  },
  'picker-choose'(d) {
    const s = ui.sheet;
    if (s.target === 'workout') {
      const w = getWorkout(ui.ctxWorkoutId); if (!w) return;
      const we = makeWE(d.id, {}, w.startedAt); w.exercises.push(we); ui.openWE = we.id; touch(w);
    } else {
      const t = currentTemplate(); if (!t) return;
      t.items.push({ id: uid(), exerciseId: d.id, warmups: 0, sets: 3, reps: null, restSec: null }); touch(t);
    }
    persist(); ui.sheet = null; render();
  },
  'finish'() { ui.sheet = { type: 'finish' }; renderSheet(); },
  'finish-yes'() {
    const w = activeWorkout(); if (!w) return;
    w.exercises.forEach(we => { we.sets = we.sets.filter(s => s.done); });
    w.exercises = w.exercises.filter(we => we.sets.length);
    const dur = Math.max(60000, Date.now() - new Date(w.timerStart || w.startedAt).getTime());
    w.endedAt = new Date(new Date(w.startedAt).getTime() + dur).toISOString(); touch(w);
    db.meta.activeWorkoutId = null; stopRest(); persist();
    ui.sheet = { type: 'summary', workoutId: w.id }; ui.openWE = null; render(); window.scrollTo(0, 0);
  },
  'cancel-workout'() { ui.sheet = { type: 'cancel' }; renderSheet(); },
  'cancel-yes'() {
    const w = activeWorkout(); if (w) { w.deleted = true; touch(w); }
    db.meta.activeWorkoutId = null; stopRest(); persist(); ui.sheet = null; render();
  },
  'goto-progress'() { const w = getWorkout(ui.sheet.workoutId); if (w && w.exercises[0]) { ui.progressEx = w.exercises[0].exerciseId; ui.ptSel = null; } ui.sheet = null; ui.tab = 'progress'; render(); window.scrollTo(0, 0); },
  'open-workout'(d) { ui.editingWorkoutId = d.id; ui.openWE = 'none'; ui.noteOpen = {}; render(); window.scrollTo(0, 0); },
  'close-edit'() { ui.editingWorkoutId = null; render(); },
  'delete-workout'(d) { ui.sheet = { type: 'delete-workout', id: d.id }; renderSheet(); },
  'delete-workout-yes'() {
    const w = getWorkout(ui.sheet.id); if (w) { w.deleted = true; touch(w); }
    persist(); ui.sheet = null; ui.editingWorkoutId = null; toast('Training verwijderd'); render();
  },
  'period'(d) { ui.period = d.p; ui.ptSel = null; render(); },
  'pt'(d) { ui.ptSel = Number(d.k); render(); },
  'new-template'() {
    const t = { id: uid(), name: '', items: [], updatedAt: nowIso(), deleted: false };
    db.templates.push(t); persist();
    ui.tab = 'schemas'; ui.editingTemplateId = t.id; render(); window.scrollTo(0, 0);
    const n = $('#t-name'); if (n) n.focus();
  },
  'edit-template'(d) { ui.editingTemplateId = d.id; render(); window.scrollTo(0, 0); },
  'close-template'() {
    const t = currentTemplate();
    if (t && !t.name.trim()) { t.name = 'Schema ' + live(db.templates).length; touch(t); persist(); }
    ui.editingTemplateId = null; render();
  },
  'item-step'(d) {
    const f = findItem(d.item); if (!f || !f.it) return;

    touch(f.t); persist(); render();
  },
  'item-move'(d) {
    const f = findItem(d.item); if (!f || !f.it) return;
    const arr = f.t.items, i = arr.indexOf(f.it), j = i + Number(d.d);
    if (j < 0 || j >= arr.length) return;
    arr.splice(i, 1); arr.splice(j, 0, f.it); touch(f.t); persist(); render();
  },
  'item-remove'(d) {
    const f = findItem(d.item); if (!f) return;

  },
  'delete-template'(d) { ui.sheet = { type: 'delete-template', id: d.id }; renderSheet(); },
  'delete-template-yes'() {
    const t = getTemplate(ui.sheet.id); if (t) { t.deleted = true; touch(t); }

  'restore-merge'() { db = mergeData(db, ui.sheet.data); persist(); ui.sheet = null; toast('Back-up samengevoegd'); render(); },
  'restore-replace'() {
    const keepActive = null;
    db = migrate(JSON.parse(JSON.stringify(ui.sheet.data)));
    db.meta.activeWorkoutId = keepActive; persist(); ui.sheet = null; toast('Back-up teruggezet'); render();
  }
};

const inputs = {

  'set-kg'(el) { const loc = locateWE(el.dataset.we); if (!loc) return; const s = loc.we.sets.find(x => x.id === el.dataset.set); if (s) { s.kg = parseNum(el.value); touch(loc.w); persist(); } },

  'note'(el) { const loc = locateWE(el.dataset.we); if (loc) { loc.we.note = el.value; touch(loc.w); persist(); } },

  't-name'(el) { const t = currentTemplate(); if (t) { t.name = el.value; touch(t); persist(); } },
  'item-reps'(el) { const f = findItem(el.dataset.item); if (f && f.it) { const n = parseNum(el.value); f.it.reps = n ? Math.round(n) : null; touch(f.t); persist(); } }
};
const changes = {
  'pk-muscle'(el) { const s = ui.sheet; s.group = el.value; s.act = Object.assign({}, GROUP_ACT[el.value]); renderSheet(); },

  'set-theme'(el) { db.settings.theme = el.value; touch(db.settings); persist(); render(); },
  'item-rest'(el) { const f = findItem(el.dataset.item); if (f && f.it) { f.it.restSec = Number(el.value) || null; touch(f.t); persist(); } },
  'we-rest'(el) { const loc = locateWE(ui.sheet.weId); if (loc) { loc.we.restSec = Number(el.value); touch(loc.w); persist(); render(); } },
  'restore'(el) { handleRestoreFile(el.files && el.files[0]); el.value = ''; }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('keydown', e => {

});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && inputs[el.dataset.in]) inputs[el.dataset.in](el); });

document.addEventListener('click', e => {
  const lab = e.target.closest('.date-pick'); if (!lab) return;
  const inp = lab.querySelector('input'); if (!inp || e.target === inp) return;
  try { if (inp.showPicker) { e.preventDefault(); inp.showPicker(); } } catch (x) { }
});
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('num')) { try { e.target.select(); } catch (x) { } } });
document.addEventListener('pointerdown', unlockAudio, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persist(); else { updateClocks(); syncWakeLock(); } });
window.addEventListener('pagehide', persist);

try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { }); } catch (e) { }
if ('serviceWorker' in navigator && location.protocol === 'https:' && !inFrame) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { }); });
}
if (activeWorkout()) ui.tab = 'training';

/* Testhaakje: maakt de rekenregels los te controleren */
window.__trainingslog = { muscleLoad, workingWeight, mergeData, recordsIn, placeholders, migrate };

render();
})();
